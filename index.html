}
async function proximoXml(){
  const f = (S.filaXml || []).shift();
  if (!f){ if (S.filaTotal > 1) toast(`${S.filaFeitas} de ${S.filaTotal} nota(s) lançadas.`); S.compraImport = null; return; }
  let x, txt;

  const e = emp(), fc = dig(x.fornecedor.cnpj);

  if (x.destinatario.cnpj && dig(x.destinatario.cnpj) !== dig(e.cnpj)) x.erros.push(`Esta nota foi emitida para outro CNPJ (${fmtDoc(x.destinatario.cnpj)}), não para ${esc(e.razao)}.`);
  if (x.chave && S.compras.some(c => c.chave === x.chave && c.status !== 'estornada')) x.erros.push('Esta nota de compra já foi lançada.');
  x.itens.forEach(it => {
    const v = S.vinculos.find(v => dig(v.fornecedor_cnpj) === fc && String(v.cProd) === it.cProd && S.produtos.some(p => p.id === v.produto_id));

async function garantirFornecedor(f){
  const c = dig(f.cnpj); if (!c) return null;
  const ex = S.fornecedores.find(x => x.cnpj === c); if (ex) return ex.id;
  const o = await put('fornecedores', { cnpj:c, nome:(f.nome || '').toUpperCase(), fantasia:f.fantasia || '', ie:dig(f.ie), logradouro:f.logradouro || '', numero:f.numero || '',
    bairro:f.bairro || '', municipio:f.municipio || '', cod_municipio:dig(f.cod_municipio), uf:f.uf || '', cep:dig(f.cep), telefone:f.telefone || '' });
  return o.id;
}
function tribPadrao(){
  const simples = String(emp().regime) !== '3', perf = S.perfis.find(f => f.id === S.ciPerf);
  return perf ? { ...taxOf(perf), perfil_id:perf.id } : { cfop:'5102', cst_csosn:simples ? '102' : '00', icms_aliq:simples ? 0 : 20.5, icms_red:0, st_mva:0, st_aliq:0, st_fcp:0,
    pis_cst:simples ? '49' : '01', pis_aliq:0, cofins_cst:simples ? '49' : '01', cofins_aliq:0, cst_ibscbs:'000', cclasstrib:'000001', perfil_id:'' };
}
// grava a compra: cria produtos novos, chama o banco (entrada no estoque) e guarda o XML original
async function gravarCompra(compra, novos, xmlTexto){
  const base = tribPadrao();
  for (const it of novos){
    const p = await put('produtos', { ...base, descricao:(it.novoDesc || it.xProd).toUpperCase(), codigo:'', gtin:gtinOk(it.ean) ? dig(it.ean) : 'SEM GTIN',
      preco:numIn(it.preco), unidade:(num(it.fator) > 1 ? 'UN' : it.uCom || 'UN').slice(0, 6), ncm:dig(it.ncm), cest:dig(it.cest), origem:({ '1':'2', '6':'7' })[it.orig] || it.orig || '0' });
    it.produto_id = p.id; it.eraNovo = true;
  }
  compra.itens = compra.itens.map(it => { const q = Math.round(num(it.qCom) * num(it.fator) * 1000) / 1000;
    return { ...it, qtd_estoque:q, custo_unit:q > 0 ? Math.round(num(it.custoTotal) / q * 10000) / 10000 : 0, custo_total:r2(num(it.custoTotal)) }; });
  compra.tem_xml = !!xmlTexto || !!compra.xml_id;
  const { data:cid, error } = await SB.rpc('lancar_compra', { e:S.empId, compra });
  if (error) throw new Error(error.message);
  if (xmlTexto) await put('compras_xml', { id:cid, arquivo:compra.arquivo || '', xml:xmlTexto });
  return cid;
}
async function lancarCompraXml(btn){
  const x = S.compraImport, errs = [];
  x.itens.forEach(it => { if (!(num(it.fator) > 0)) errs.push(`Conversão inválida em ${esc(it.xProd)}.`); });
  if (errs.length) return $('#errM').innerHTML = `<div class="msg err">${errs.join('<br>')}</div>`;
  btn.disabled = true; $('#errM').innerHTML = '<div class="msg info">Lançando…</div>';
  try {
    const fornecedor_id = await garantirFornecedor(x.fornecedor);
    const itens = x.itens.map(it => ({ ...it, vinc_chave:chaveVinc(x.fornecedor.cnpj, it.cProd) }));
    const novos = itens.filter(it => it.produto_id === 'novo');
    const compra = { origem:'xml', modelo:x.modelo, chave:x.chave, numero:x.numero, serie:x.serie, natureza:x.natureza, data_emissao:x.data_emissao, data_entrada:hoje(),
      fornecedor_id, fornecedor_cnpj:dig(x.fornecedor.cnpj), fornecedor_nome:(x.fornecedor.fantasia || x.fornecedor.nome || '').toUpperCase(), fornecedor:x.fornecedor,
      destinatario:x.destinatario, totais:x.totais, total_produtos:x.totais.vProd, total_nota:x.totais.vNF, duplicatas:x.duplicatas,
      pagamento:x.duplicatas.length ? 'prazo' : 'avista', obs:x.obs, arquivo:x.arquivo, itens };
    await gravarCompra(compra, novos, x.xmlTexto);
    const semPreco = novos.filter(i => !(numIn(i.preco) > 0)).length;
    S.filaFeitas = (S.filaFeitas || 0) + 1; closeModal();
    toast(`Nota ${x.numero} lançada: ${itens.length} item(ns) no estoque.${semPreco ? ' Defina o preço dos produtos novos.' : ''}`);
    if (x.chave && S.recebidas.some(r => r.chave === x.chave)) confirmarRecebidaLancada(x.chave);
    proximoXml();
  } catch(err){ btn.disabled = false; $('#errM').innerHTML = `<div class="msg err">${esc(err.message)}</div>`; }

async function salvarCompra(btn){

    if (!(numIn(i.vUnCom) >= 0) || i.vUnCom === '') errs.push(`${esc(nome)}: informe o valor unitário.`);

    vFrete:i.vFrete, vSeg:i.vSeg, vOutro:i.vOutro, vBC:numIn(i.vBC), pICMS:numIn(i.pICMS), vICMS:numIn(i.vICMS), vICMSST:numIn(i.vICMSST), vIPI:numIn(i.vIPI),
    custoTotal:i.custoTotal, produto_id:i.produto_id, fator:numIn(i.fator), novoDesc:i.novoDesc, preco:i.preco, ean:i.ean || '', ...(i.vinc_chave ? { vinc_chave:i.vinc_chave } : {}) }));
  const compra = { origem:'manual', modelo:c.modelo, chave:dig(c.chave), numero:dig(c.numero) || c.numero, serie:c.serie, natureza:c.natureza, data_emissao:c.data_emissao, data_entrada:c.data_entrada || hoje(),
    fornecedor_id:f.id, fornecedor_cnpj:f.cnpj, fornecedor_nome:(f.fantasia || f.nome || '').toUpperCase(), fornecedor:f, destinatario:{ cnpj:e.cnpj, nome:e.razao },
    totais:{ ...t, vBCST:0 }, total_produtos:t.vProd, total_nota:t.vNF, pagamento:c.pagamento,
    duplicatas:c.pagamento === 'prazo' ? c.duplicatas.map(d => ({ n:d.n, venc:d.venc, valor:numIn(d.valor) })) : [], obs:c.obs, xml_id:c.xml_id || null, corrige:c.corrige || null, itens };

// código de barras CODE-128C da chave de acesso (padrão do DANFE), em SVG
function barras128C(digs){
  const vals = [105]; for (let i = 0; i < digs.length; i += 2) vals.push(+digs.substr(i, 2));
  vals.push(vals.reduce((a, v, i) => a + v * (i || 1), 0) % 103, 106);
  let x = 10, rects = '';
  vals.forEach(v => [...C128[v]].forEach((w, i) => { w = +w; if (i % 2 === 0) rects += `<rect x="${x}" y="0" width="${w}" height="50"/>`; x += w; }));
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${x + 10} 50" preserveAspectRatio="none" shape-rendering="crispEdges" style="width:100%;height:12mm;display:block">${rects}</svg>`;
}

    dup:[...d.getElementsByTagName('dup')].map(x => ({ n:g(x, 'nDup'), venc:g(x, 'dVenc'), valor:n(x, 'vDup') })),

    transp:{ mod:g(tr, 'modFrete'), nome:g(ta, 'xNome'), antt:g(vei, 'RNTC'), placa:g(vei, 'placa'), ufPlaca:g(vei, 'UF'), doc:g(ta, 'CNPJ') || g(ta, 'CPF'), end:g(ta, 'xEnder'), mun:g(ta, 'xMun'), uf:g(ta, 'UF'), ie:g(ta, 'IE'),
      qVol:g(vol, 'qVol'), esp:g(vol, 'esp'), marca:g(vol, 'marca'), nVol:g(vol, 'nVol'), pesoB:g(vol, 'pesoB'), pesoL:g(vol, 'pesoL') },
    itens:[...d.getElementsByTagName('det')].map(det => { const pr = det.getElementsByTagName('prod')[0], imp = det.getElementsByTagName('imposto')[0];
      const icW = imp && imp.getElementsByTagName('ICMS')[0], ic = icW && icW.firstElementChild, ipi = imp && imp.getElementsByTagName('IPI')[0];

const CFOP_ST_COMPRA = ['5401','5402','5403','5405','6401','6402','6403','6404'];
// índice compra → devoluções, refeito só quando a lista de notas muda (antes varria todas as notas para cada compra)
let _idxDev = { ref:null, len:-1, sig:'', map:new Map() };
function indiceDev(){
  const N = S.notas, sig = N.length ? N[N.length - 1].id + (N[N.length - 1].status || '') : '';
  if (_idxDev.ref !== N || _idxDev.len !== N.length || _idxDev.sig !== sig){
    const m = new Map();
    for (const n of N) if (n.op === 'dev_compra' && n.compra_id && notaValida(n)){ let a = m.get(n.compra_id); if (!a) m.set(n.compra_id, a = []); a.push(n); }
    _idxDev = { ref:N, len:N.length, sig, map:m };
  }
  return _idxDev.map;
}
const devsDaCompra = cid => indiceDev().get(cid) || [];
function devolvidoPorItem(cid){
  const q = {}; devsDaCompra(cid).forEach(n => (n.dev_itens || []).forEach(d => q[d.i] = rq((q[d.i] || 0) + num(d.q)))); return q;
}
function situacaoDev(c){
  const dv = devolvidoPorItem(c.id), its = c.itens || []; if (!Object.keys(dv).length) return '';
  return its.every((it, i) => num(dv[i]) >= num(it.qCom) - 0.0001) ? 'total' : 'parcial';
}
function formDevCompra(cid){
  const c = S.compras.find(x => x.id === cid); if (!c) return;
  if (!chaveOk(c.chave || '')) return toast('Esta compra não tem chave de acesso. A devolução precisa referenciar a NF-e do fornecedor.');
  const dv = devolvidoPorItem(cid);
  S.dc = { cid, motivo:'', q:(c.itens || []).map((it, i) => { const r = rq(num(it.qCom) - num(dv[i])); return r > 0 ? v2(r) : ''; }) };
  renderDevCompra();
}
function calcDevCompra(){
  const c = S.compras.find(x => x.id === S.dc.cid), dv = devolvidoPorItem(c.id);
  let total = 0, outras = 0, ipi = 0, st = 0; const linhas = [];
  (c.itens || []).forEach((it, i) => {
    const q = numIn(S.dc.q[i]), resta = rq(num(it.qCom) - num(dv[i]));
    if (!(q > 0)) return;
    const k = q / num(it.qCom), fator = num(it.fator) || 1;
    const desc = r2(num(it.vDesc) * k), ex = r2((num(it.vFrete) + num(it.vSeg) + num(it.vOutro)) * k), vipi = r2(num(it.vIPI) * k), vst = r2(num(it.vICMSST) * k);
    const bruto = r2(num(it.vUnCom) * q);
    linhas.push({ i, it, q, resta, fator, qEst:rq(q * fator), preco:Math.round(num(it.vUnCom) / fator * 10000) / 10000, desc, ex, vipi, vst, bruto });
    total += bruto - desc + ex + vipi + vst; outras += ex + vipi + vst; ipi += vipi; st += vst;
  });
  return { c, dv, linhas, total:r2(total), outras:r2(outras), ipi:r2(ipi), st:r2(st) };
}

async function clienteDoFornecedor(c){

/* ---------- FINANCEIRO: contas a pagar e a receber ----------

const CAT_PAGAR = ['Fornecedores','Aluguel','Energia','Água','Internet e telefone','Salários','Impostos','Contador','Manutenção','Outras despesas'];

async function finSalvar(id){

  const base = { tipo, descricao:desc, pessoa:v('fnPessoa').trim(), categoria:v('fnCat'), valor:r2(valor), obs:v('fnObs').trim() };
  if (id){ const old = (S.financeiro || []).find(x => x.id === id); await put('financeiro', { ...old, ...base, venc }); closeModal(); toast('Conta atualizada.'); return; }

    await put('financeiro', { ...base, descricao:rep > 1 ? `${desc} (${k + 1}/${rep})` : desc, venc:vk, grupo, criado_em:isoNow(), ...(pago && k === 0 ? { pago_em:isoNow().slice(0, 10), valor_pago:r2(valor), forma:'outros' } : {}) });
  }
  closeModal(); toast(rep > 1 ? `${rep} contas lançadas.` : 'Conta lançada.');
}

function lerBalanca(cod){

const lerBase64 = file => new Promise((ok, erro) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1] || ''); r.onerror = () => erro(new Error('Não foi possível ler o arquivo.')); r.readAsDataURL(file); });
async function enviarCertificado(btn){
  const f = ($('#certArq').files || [])[0], senha = $('#certSenha').value, el = $('#errCert');
  if (!f) return el.innerHTML = '<div class="msg err">Escolha o arquivo do certificado (.pfx ou .p12).</div>';

  if (!senha) return el.innerHTML = '<div class="msg err">Informe a senha do certificado.</div>';

  try {
    const r = await api('certificado', { empresa_id:S.empId, arquivo_base64:await lerBase64(f), senha, csc_id:val('certCscId'), csc:val('certCsc'), manifestacao:$('#certManif').checked });

}

document.addEventListener('input', ev => {
  const t = ev.target; if (inputV4(t)) return; if (autoPreencher(t)) return; if (inputEstoque(t)) return; if (inputFin(t)) return;
  if (t.id === 'busca'){ S.busca = t.value; $('#resV').innerHTML = resultadosHtml(separarMult(S.busca).q, 'addCart'); }
  else if (t.id === 'ntBusca'){ S.ntBusca = t.value; S.ntLim = 30; render(); }
  else if (t.id === 'buscaNfe'){ S.buscaNfe = t.value; $('#resN').innerHTML = resultadosHtml(S.buscaNfe, 'addNfe'); }
  else if (t.dataset.pv !== undefined){ S.pags[+t.dataset.pv].valor = t.value; }
  else if (t.id === 'descTot'){ S.descTotal.v = t.value; }
  else if (t.id === 'nDescTot'){ S.nfe.descTotal.v = t.value; }
  else if (t.id === 'nFrete'){ S.nfe.vFrete = t.value; } else if (t.id === 'nSeguro'){ S.nfe.vSeguro = t.value; } else if (t.id === 'nOutras'){ S.nfe.vOutras = t.value; }
  else if (t.id === 'dfAliq'){ S.nfe.difal.aliq = t.value; } else if (t.id === 'dfFcp'){ S.nfe.difal.fcp = t.value; }
  else if (t.dataset.nd !== undefined){ S.nfe.itens[+t.dataset.nd].desc = t.value; }
  else if (t.id === 'pNcm'){ $('#ncmInfo').innerHTML = ncmInfoHtml(t.value); }
  else if (t.id === 'ncmBusca'){ S.ncmQ = t.value; $('#ncmRes').innerHTML = ncmBuscaHtml(S.ncmQ); }
  else if (t.id === 'cpf'){ S.cpf = t.value; }
  else if (t.id === 'nomeCons'){ S.nomeCons = t.value; }
  else if (t.id === 'nfeNat'){ S.nfe.natureza = t.value; }
  else if (t.id === 'nfeObs'){ S.nfe.obs = t.value; }
  else if (t.id === 'nfeFisco'){ S.nfe.fisco = t.value; }
  else if (t.dataset.nf !== undefined){ const [a, b] = t.dataset.nf.split('.'); if (b) S.nfe[a][b] = t.value; else S.nfe[a] = t.value; }
  else if (t.dataset.nfd !== undefined){ const [k, f] = t.dataset.nfd.split(':'); S.nfe.dups[+k][f] = t.value;
    const el = $('#nfeDupTot'); if (el){ const tot = r2(S.nfe.dups.reduce((a, d) => a + numIn(d.valor), 0)), T = totais(nfeLinhas());
      el.innerHTML = `<span>Soma das duplicatas</span><span class="num" style="color:${Math.abs(tot - T.nota) > 0.009 ? 'var(--bad)' : 'var(--ok)'}">${brl(tot)}</span>`; } }
});
// re-renderiza depois que o foco já foi para o próximo campo (não perde o toque no celular)
let laterT; const later = () => { clearTimeout(laterT); laterT = setTimeout(render, 0); };
document.addEventListener('change', ev => {
  const t = ev.target;
  if (changeV4(t)) return;
  if (changeEstoque(t)) return;
  if (t.dataset.membro !== undefined){ SB.rpc('alterar_papel', { e:S.empId, uid:t.dataset.membro, p_papel:t.value }).then(({ error }) => { toast(error ? error.message : 'Papel alterado.'); carregarMembros(); }); return; }
  if (t.id === 'ncmFile'){ if (t.files[0]) lerArquivoNcm(t.files[0]); return; }
  if (t.id === 'empSel'){ if (t.value === '__nova'){ renderHeader(); formEmpresa(); } else if (t.value) setEmp(t.value); }
  else if (t.dataset.qi !== undefined){ const q = numIn(t.value); const i = +t.dataset.qi; if (q > 0) S.cart[i].qtd = q; else S.cart.splice(i, 1); later(); }
  else if (t.dataset.nq !== undefined){ S.nfe.itens[+t.dataset.nq].qtd = numIn(t.value); later(); }
  else if (t.dataset.np !== undefined){ S.nfe.itens[+t.dataset.np].preco = numIn(t.value); later(); }
  else if (t.dataset.pv !== undefined || ['descTot','nDescTot','nFrete','nSeguro','nOutras','dfAliq','dfFcp'].includes(t.id) || t.dataset.nd !== undefined){ later(); }
  else if (t.id === 'relIni' || t.id === 'relFim'){ if (t.value){ S[t.id] = t.value; S.relLim = 30; render(); } }
  else if (t.id === 'ntMes'){ S.ntMes = t.value; S.ntLim = 30; render(); }
  else if (t.id === 'dfMet'){ S.nfe.difal.metodo = t.value; render(); }
  else if (t.id === 'nfeCli'){ selCliente(t.value); }
  else if (t.dataset.papel !== undefined){ if (!pode('usuarios')) return; safe(() => db.collection('usuarios').doc(t.dataset.papel).update({ papel:t.value }), 'Papel alterado.'); }
  else if (t.id === 'bkFile'){ if (t.files[0]) lerBackup(t.files[0]); }
  else if (t.id === 'nfeFrete'){ S.nfe.frete = t.value; render(); }
  else if (t.id === 'nfePag'){ S.nfe.pag = t.value; }
  else if (t.id === 'nfePres'){ S.nfe.presenca = t.value; }
  else if (t.id === 'nfeSaida'){ S.nfe.saida = t.value; }
  else if (t.id === 'nfeTrSel' && t.value !== ''){ const x = (emp().transportadoras || [])[+t.value]; if (x) S.nfe.transp = { nome:x.nome || '', doc:fmtDoc(x.doc), ie:x.ie || '', end:x.end || '', mun:x.mun || '', uf:x.uf || '', placa:x.placa || '', veicUf:x.veicUf || '', rntc:x.rntc || '' }; render(); }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') closeModal();
  if (ev.key === 'Enter' && ['lgEmail','lgSenha','lgNova'].includes(ev.target.id)){ const b = document.querySelector('#main .btn.pri'); if (b) b.click(); }
  if (ev.key === 'Enter' && ev.target.id === 'busca'){ ev.preventDefault(); entradaBusca(ev.target.value); return; }
  if (teclaCupom(ev)) return;
});
init();
</script>
